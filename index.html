<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        function findSum() {
    let a = 0;

    for (let number = 1; number < 1000; number++) {
      if (number % 3 === 0 || number % 5 === 0) {
        a += number;
      }
    }

    alert(" Sum of all 3 or 5 below 1000 is  " + a);
  }
    </script>
    <title>Exercise 2</title>
</head>
<body>
    <h1> Exercise 2:
        If we list all the natural numbers below 10 that are multiples of 3 or 5, we get 3, 5, 6 and 9. The sum of these multiples is 23.

        Find the sum of all the multiples of 3 or 5 below 1000 and alert the user to the correct answer.</h1>
 <h2>Click the button to find the sum!</h2>
<button onclick="findSum()">Calculate Sum</button>
</body>
</html>
